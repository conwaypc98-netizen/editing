name: Windows portable smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-portable.yml"
      - "Install-Windows.ps1"
      - "luna-longform-editor/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/windows-portable.yml"
      - "Install-Windows.ps1"
      - "luna-longform-editor/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure FFmpeg is available
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" +
              [Environment]::GetEnvironmentVariable("Path", "User")
          }
          ffmpeg -version
          ffprobe -version

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("PowerShell parse failure in {0}: {1}" -f $_.FullName, ($errors -join "; "))
            }
          }
          if ($failed) { throw "One or more PowerShell scripts failed to parse." }

      - name: Install portable skill and tool environment
        shell: pwsh
        run: |
          .\Install-Windows.ps1
          $skill = Join-Path $HOME ".codex\skills\luna-longform-editor\SKILL.md"
          $toolPython = Join-Path $HOME ".codex\tools\luna-longform-editor\transcribe-venv\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $skill)) { throw "Installed skill is missing: $skill" }
          if (-not (Test-Path -LiteralPath $toolPython)) { throw "Tool Python is missing: $toolPython" }
          & $toolPython -c "import faster_whisper, websockets; assert websockets.__version__ == '15.0.1'"

      - name: Exercise native Windows discovery paths
        shell: pwsh
        run: |
          python .\luna-longform-editor\scripts\record_desktop.py devices
          python .\luna-longform-editor\scripts\capture_window_storyboard.py windows

      - name: Check every Python CLI
        shell: pwsh
        run: |
          Get-ChildItem .\luna-longform-editor\scripts\*.py | ForEach-Object {
            python $_.FullName --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "CLI help failed: $($_.FullName)" }
          }

      - name: Run regression suite
        shell: pwsh
        run: python -m unittest -v tests.test_editor_system
